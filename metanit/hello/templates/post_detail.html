{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo"></div>
        <span>iodzen</span>
      </div>
      <nav class="d-inline-flex mt-1 mt-md-0 ms-md-auto">
        <a class="py-2 link-body-emphasis text-decoration-none" href="/">Главная страница</a>
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/about">Мероприятия</a>
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/contact">Документы</a>
      </nav>
    </header>

    <p class="breadcrumbs"><a href="/">Блог</a> / {{ post.title }}</p>

    <article class="prose mt-24">
      <h1>{{ post.title }}</h1>
      <p class="muted" style="font-size:12px">{{ post.created_at|date:"d M Y" }}</p>
      <div class="cover" style="border-radius:16px;margin:16px 0"></div>
      {{ post.content|linebreaks }}
    </article>

    <footer class="footer">
      <div class="copy">© 2025 iodzen</div>
    </footer>
</div>
</body>
</html>
